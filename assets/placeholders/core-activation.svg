<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Core Activation Circuit instruction card</title>
  <desc id="desc">Text-only sequence card replacing a generated image with malformed anatomy.</desc>
  <rect width="1200" height="675" rx="36" fill="#0d1218"/>
  <rect x="34" y="34" width="1132" height="607" rx="28" fill="#151c24" stroke="#ef4444" stroke-width="4"/>
  <text x="78" y="105" fill="#ff5959" font-family="Arial,sans-serif" font-size="30" font-weight="700">CONTROLLED CIRCUIT</text>
  <text x="78" y="170" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800">Core Activation</text>
  <g font-family="Arial,sans-serif">
    <rect x="78" y="225" width="318" height="260" rx="24" fill="#202a35"/>
    <text x="108" y="280" fill="#ff5959" font-size="26" font-weight="800">1 • DEAD BUG</text>
    <text x="108" y="335" fill="#fff" font-size="30" font-weight="700">8 per side</text>
    <text x="108" y="385" fill="#b7c0cb" font-size="23">Lower back stays</text><text x="108" y="418" fill="#b7c0cb" font-size="23">gently controlled.</text>
    <rect x="441" y="225" width="318" height="260" rx="24" fill="#202a35"/>
    <text x="471" y="280" fill="#ff5959" font-size="26" font-weight="800">2 • BIRD DOG</text>
    <text x="471" y="335" fill="#fff" font-size="30" font-weight="700">8 per side</text>
    <text x="471" y="385" fill="#b7c0cb" font-size="23">Reach long without</text><text x="471" y="418" fill="#b7c0cb" font-size="23">rotating the hips.</text>
    <rect x="804" y="225" width="318" height="260" rx="24" fill="#202a35"/>
    <text x="834" y="280" fill="#ff5959" font-size="26" font-weight="800">3 • PLANK</text>
    <text x="834" y="335" fill="#fff" font-size="30" font-weight="700">20–40 seconds</text>
    <text x="834" y="385" fill="#b7c0cb" font-size="23">Keep ribs and hips</text><text x="834" y="418" fill="#b7c0cb" font-size="23">stacked; breathe.</text>
  </g>
  <text x="78" y="565" fill="#ffcc66" font-family="Arial,sans-serif" font-size="25" font-weight="700">Stop the set before position or breathing breaks down.</text>
</svg>
