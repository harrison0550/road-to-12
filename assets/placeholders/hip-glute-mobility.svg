<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hip and Glute Mobility instruction card</title>
  <desc id="desc">Text-only mobility sequence card replacing inaccurate generated anatomy.</desc>
  <rect width="1200" height="675" rx="36" fill="#0d1218"/>
  <rect x="34" y="34" width="1132" height="607" rx="28" fill="#151c24" stroke="#ef4444" stroke-width="4"/>
  <text x="78" y="105" fill="#ff5959" font-family="Arial,sans-serif" font-size="30" font-weight="700">MOBILITY SEQUENCE</text>
  <text x="78" y="170" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800">Hips &amp; Glutes</text>
  <g font-family="Arial,sans-serif">
    <rect x="78" y="225" width="318" height="260" rx="24" fill="#202a35"/>
    <text x="108" y="280" fill="#ff5959" font-size="26" font-weight="800">1 • HIP FLEXOR</text>
    <text x="108" y="335" fill="#fff" font-size="29" font-weight="700">Half kneeling</text>
    <text x="108" y="385" fill="#b7c0cb" font-size="23">Pelvis tucked;</text><text x="108" y="418" fill="#b7c0cb" font-size="23">torso stays tall.</text>
    <rect x="441" y="225" width="318" height="260" rx="24" fill="#202a35"/>
    <text x="471" y="280" fill="#ff5959" font-size="26" font-weight="800">2 • FIGURE FOUR</text>
    <text x="471" y="335" fill="#fff" font-size="29" font-weight="700">Supported hold</text>
    <text x="471" y="385" fill="#b7c0cb" font-size="23">Keep the stretch</text><text x="471" y="418" fill="#b7c0cb" font-size="23">gentle and steady.</text>
    <rect x="804" y="225" width="318" height="260" rx="24" fill="#202a35"/>
    <text x="834" y="280" fill="#ff5959" font-size="26" font-weight="800">3 • HIP ROTATION</text>
    <text x="834" y="335" fill="#fff" font-size="29" font-weight="700">Pain-free range</text>
    <text x="834" y="385" fill="#b7c0cb" font-size="23">Move slowly; never</text><text x="834" y="418" fill="#b7c0cb" font-size="23">force the joint.</text>
  </g>
  <text x="78" y="565" fill="#ffcc66" font-family="Arial,sans-serif" font-size="25" font-weight="700">Repeat both sides • No bouncing • Stop for sharp pain</text>
</svg>
