<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Dynamic warm-up guide</title><desc id="d">A text-based warm-up sequence without generated anatomy.</desc>
  <rect width="1200" height="675" rx="36" fill="#0d1218"/><rect x="34" y="34" width="1132" height="607" rx="28" fill="#151c24" stroke="#ef4444" stroke-width="4"/>
  <text x="78" y="105" fill="#ff5959" font-family="Arial" font-size="30" font-weight="700">CONTROLLED WARM-UP</text><text x="78" y="170" fill="#fff" font-family="Arial" font-size="52" font-weight="800">Dynamic Warm-Up</text>
  <g font-family="Arial"><rect x="78" y="225" width="318" height="260" rx="24" fill="#202a35"/><text x="108" y="280" fill="#ff5959" font-size="26" font-weight="800">1 • ARM CIRCLES</text><text x="108" y="335" fill="#fff" font-size="29" font-weight="700">30 sec each way</text><text x="108" y="385" fill="#b7c0cb" font-size="23">Shoulders relaxed;</text><text x="108" y="418" fill="#b7c0cb" font-size="23">smooth circles.</text>
  <rect x="441" y="225" width="318" height="260" rx="24" fill="#202a35"/><text x="471" y="280" fill="#ff5959" font-size="26" font-weight="800">2 • SQUAT</text><text x="471" y="335" fill="#fff" font-size="29" font-weight="700">10 controlled reps</text><text x="471" y="385" fill="#b7c0cb" font-size="23">Heels planted;</text><text x="471" y="418" fill="#b7c0cb" font-size="23">knees follow toes.</text>
  <rect x="804" y="225" width="318" height="260" rx="24" fill="#202a35"/><text x="834" y="280" fill="#ff5959" font-size="26" font-weight="800">3 • HIP HINGE</text><text x="834" y="335" fill="#fff" font-size="29" font-weight="700">10 controlled reps</text><text x="834" y="385" fill="#b7c0cb" font-size="23">Hips move back;</text><text x="834" y="418" fill="#b7c0cb" font-size="23">spine stays long.</text></g>
  <text x="78" y="565" fill="#ffcc66" font-family="Arial" font-size="25" font-weight="700">Move slowly • Use a pain-free range • No bouncing</text>
</svg>
