<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hip Flexor Mobility instruction card</title>
  <desc id="desc">Text-only safety-first setup card replacing inaccurate generated anatomy.</desc>
  <rect width="1200" height="675" rx="36" fill="#0d1218"/>
  <rect x="34" y="34" width="1132" height="607" rx="28" fill="#151c24" stroke="#ef4444" stroke-width="4"/>
  <text x="78" y="105" fill="#ff5959" font-family="Arial,sans-serif" font-size="30" font-weight="700">ACCURATE SETUP GUIDE</text>
  <text x="78" y="170" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800">Hip Flexor Mobility</text>
  <g font-family="Arial,sans-serif">
    <circle cx="118" cy="260" r="32" fill="#ef4444"/><text x="108" y="271" fill="#fff" font-size="30" font-weight="800">1</text>
    <text x="175" y="250" fill="#fff" font-size="31" font-weight="700">Half-kneeling stance</text>
    <text x="175" y="290" fill="#b7c0cb" font-size="25">Front foot flat; rear knee supported on padding.</text>
    <circle cx="118" cy="380" r="32" fill="#ef4444"/><text x="108" y="391" fill="#fff" font-size="30" font-weight="800">2</text>
    <text x="175" y="370" fill="#fff" font-size="31" font-weight="700">Tuck the pelvis gently</text>
    <text x="175" y="410" fill="#b7c0cb" font-size="25">Stay tall. Do not arch or compress the lower back.</text>
    <circle cx="118" cy="500" r="32" fill="#ef4444"/><text x="108" y="511" fill="#fff" font-size="30" font-weight="800">3</text>
    <text x="175" y="490" fill="#fff" font-size="31" font-weight="700">Shift forward slowly</text>
    <text x="175" y="530" fill="#b7c0cb" font-size="25">Feel a gentle stretch at the front of the rear hip.</text>
  </g>
  <text x="78" y="600" fill="#ffcc66" font-family="Arial,sans-serif" font-size="25" font-weight="700">30 seconds per side • Stop for sharp pain</text>
</svg>
