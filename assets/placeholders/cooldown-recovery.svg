<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Cooldown and recovery guide</title><desc id="d">A text-based cooldown sequence without generated anatomy.</desc>
  <rect width="1200" height="675" rx="36" fill="#0d1218"/><rect x="34" y="34" width="1132" height="607" rx="28" fill="#151c24" stroke="#ef4444" stroke-width="4"/>
  <text x="78" y="105" fill="#ff5959" font-family="Arial" font-size="30" font-weight="700">RECOVERY SEQUENCE</text><text x="78" y="170" fill="#fff" font-family="Arial" font-size="52" font-weight="800">Cooldown</text>
  <g font-family="Arial"><circle cx="118" cy="260" r="32" fill="#ef4444"/><text x="108" y="271" fill="#fff" font-size="30" font-weight="800">1</text><text x="175" y="250" fill="#fff" font-size="31" font-weight="700">Lower the pace</text><text x="175" y="290" fill="#b7c0cb" font-size="25">Walk easily until breathing becomes conversational.</text>
  <circle cx="118" cy="380" r="32" fill="#ef4444"/><text x="108" y="391" fill="#fff" font-size="30" font-weight="800">2</text><text x="175" y="370" fill="#fff" font-size="31" font-weight="700">Use gentle static holds</text><text x="175" y="410" fill="#b7c0cb" font-size="25">Chest, lats, quads, hamstrings and hips; no bouncing.</text>
  <circle cx="118" cy="500" r="32" fill="#ef4444"/><text x="108" y="511" fill="#fff" font-size="30" font-weight="800">3</text><text x="175" y="490" fill="#fff" font-size="31" font-weight="700">Breathe and hydrate</text><text x="175" y="530" fill="#b7c0cb" font-size="25">Stop any hold that causes sharp pain, tingling or numbness.</text></g>
  <text x="78" y="600" fill="#ffcc66" font-family="Arial" font-size="25" font-weight="700">20–30 seconds per hold • Relaxed breathing</text>
</svg>
